name: Firebase emulator smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run emulator-backed Playwright smoke tests
        env:
          VITE_FIREBASE_API_KEY: emulator
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_PROJECT_ID: demo-ordina
          VITE_FIREBASE_STORAGE_BUCKET: demo-ordina.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: emulator
          VITE_FIREBASE_APP_ID: emulator
          VITE_USE_FIREBASE_EMULATORS: 'true'
          E2E_EMULATOR: 'true'
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-ordina "npx playwright test tests/e2e/production-smoke.spec.ts"
