version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - vite
          - svelte
          - "@sveltejs/*"
          - typescript
          - eslint
          - "@typescript-eslint/*"
      test-tooling:
        patterns:
          - vitest
          - "@playwright/test"
          - "@testing-library/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
